spring:
  application:
    name: LEARNnow

  # Database configuration (use environment variables)
  datasource:
    url: ${DATABASE_URL:jdbc:mysql://localhost:3306/learnnow}
    username: ${DATABASE_USERNAME:root}
    password: ${DATABASE_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

# Server configuration
server:
  port: ${PORT:8080}

# YouTube API configuration
youtube:
  api:
    key: ${YOUTUBE_API_KEY:}
    application-name: LEARNnow

# Groq API configuration  
groq:
  api:
    key: ${GROQ_API_KEY:}
    url: https://api.groq.com/openai/v1/chat/completions
    model: llama-3.3-70b-versatile

# JWT Secret
jwt:
  secret: ${JWT_SECRET:your-super-secret-jwt-key-change-in-production}
  expiration: 86400000

# CORS Configuration for production
cors:
  allowed-origins: ${CORS_ORIGINS:https://learnnow-frontend.onrender.com,https://learnnow.vercel.app,https://learnnow.netlify.app}